plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def samsungHealthAar = file('libs/samsung-health-sensor-api-1.4.1.aar')

android {
    namespace 'com.tak.weartak_tracker'
    compileSdk 36

    def localBuildProperties = new Properties()
    def localBuildPropertiesFile = rootProject.file("local.properties")
    if (localBuildPropertiesFile.exists()) localBuildPropertiesFile.withInputStream {
        localBuildProperties.load(it)
    }

    defaultConfig {
        applicationId "com.tak.weartak_tracker"
        minSdk 30
        targetSdk 34
        // Same scheme as WearTAK/Sextant: CI builds get versionCode base*10000 + pipeline IID and
        // versionName <base>-p<IID>+<sha>. Base code stays above the previously shipped 585.
        def baseVersionCode = 586
        def baseVersionName = "5.8.4"
        def ciPipelineIid = System.getenv('CI_PIPELINE_IID')?.isInteger() ? System.getenv('CI_PIPELINE_IID').toInteger() : null
        if (ciPipelineIid != null) {
            if (ciPipelineIid < 0 || ciPipelineIid > 9999) {
                throw new GradleException("CI_PIPELINE_IID ${ciPipelineIid} exceeds the versionCode pipeline range (0-9999).")
            }
            versionCode baseVersionCode * 10000 + ciPipelineIid
            versionName "${baseVersionName}-p${ciPipelineIid}+${System.getenv('CI_COMMIT_SHORT_SHA') ?: 'local'}"
        } else {
            versionCode baseVersionCode
            versionName baseVersionName
        }
        setProperty("archivesBaseName", "WearTAK-Tracker-${baseVersionName}-${versionCode}")
        // CI's protected DITTO_COMMUNITY_IDENTITY wins so a Gradle property can never shadow it.
        def dittoCommunityIdentity = (
                System.getenv("DITTO_COMMUNITY_IDENTITY") ?:
                project.findProperty("dittoCommunityIdentity") ?:
                localBuildProperties.getProperty("dittoCommunityIdentity") ?:
                ""
        ).toString().trim()
        if (dittoCommunityIdentity.startsWith('"') && dittoCommunityIdentity.endsWith('"')) {
            dittoCommunityIdentity = dittoCommunityIdentity.substring(1, dittoCommunityIdentity.length() - 1)
        }
        buildConfigField "String", "DITTO_COMMUNITY_IDENTITY", "\"${dittoCommunityIdentity}\""
    }

    signingConfigs {
        def ciKeystore = System.getenv('RELEASE_KEYSTORE_FILE')
        // Optional: create signing.properties (git-ignored) to sign release builds; see README.
        def signingFile = rootProject.file('signing.properties')
        if (ciKeystore) {
            def required = ['RELEASE_STORE_PASSWORD', 'RELEASE_KEY_ALIAS', 'RELEASE_KEY_PASSWORD']
            required.each { name ->
                if (!System.getenv(name)) throw new GradleException("Missing CI signing variable: ${name}")
            }
            release {
                storeFile rootProject.file(ciKeystore)
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        } else if (signingFile.exists()) {
            def props = new Properties()
            signingFile.withInputStream { props.load(it) }
            release {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('RELEASE_KEYSTORE_FILE') || rootProject.file('signing.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    testOptions {
        unitTests.all { test ->
            // Robolectric downloads Android jars outside Gradle's repositories.
            if (gradle.ext.has('takArtifactoryUrl')) {
                test.systemProperty 'robolectric.dependency.repo.id', 'takArtifactory'
                test.systemProperty 'robolectric.dependency.repo.url', gradle.ext.takArtifactoryUrl
                test.systemProperty 'robolectric.dependency.repo.username', gradle.ext.takArtifactoryUser
                test.systemProperty 'robolectric.dependency.repo.password', gradle.ext.takArtifactoryPassword
            }
        }
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
    // Skin temperature uses Samsung's proprietary SDK, which isn't committed. Without the AAR a stub
    // SkinTempMonitor is compiled and skin temperature is sent as N/A.
    sourceSets {
        main.java.srcDirs += samsungHealthAar.exists() ? 'src/samsungHealth/java' : 'src/noSamsungHealth/java'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'
    implementation 'androidx.wear.compose:compose-navigation:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'live.ditto:ditto:4.14.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Samsung Health Sensor SDK (same AAR as WearTAK-CIV) for skin temperature on Galaxy watches; optional.
    if (samsungHealthAar.exists()) implementation files(samsungHealthAar)

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
