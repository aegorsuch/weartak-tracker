plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def samsungHealthAar = file('libs/samsung-health-sensor-api-1.4.1.aar')

android {
    namespace 'com.tak.weartak_tracker'
    compileSdk 36

    defaultConfig {
        applicationId "com.tak.weartak_tracker"
        minSdk 30
        targetSdk 34
        versionCode 583
        versionName "5.8.0.3"
        setProperty("archivesBaseName", "WearTAK-Tracker-${versionName}")
    }

    signingConfigs {
        // Optional: create signing.properties (git-ignored) to sign release builds; see README.
        def signingFile = rootProject.file('signing.properties')
        if (signingFile.exists()) {
            def props = new Properties()
            signingFile.withInputStream { props.load(it) }
            release {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (rootProject.file('signing.properties').exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
    // Skin temperature uses Samsung's proprietary SDK, which isn't committed. Without the AAR a stub
    // SkinTempMonitor is compiled and skin temperature is sent as N/A.
    sourceSets {
        main.java.srcDirs += samsungHealthAar.exists() ? 'src/samsungHealth/java' : 'src/noSamsungHealth/java'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.wear.compose:compose-material:1.4.0'
    implementation 'androidx.wear.compose:compose-foundation:1.4.0'
    implementation 'androidx.wear.compose:compose-navigation:1.4.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Samsung Health Sensor SDK (same AAR as WearTAK-CIV) for skin temperature on Galaxy watches; optional.
    if (samsungHealthAar.exists()) implementation files(samsungHealthAar)

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
}
